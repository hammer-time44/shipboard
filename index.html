<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shipboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<script>try{var t=JSON.parse(localStorage.getItem("shipboard-v2")||"null");if(t&&(t.theme==="dark"||t.theme==="light"))document.documentElement.dataset.theme=t.theme}catch(e){}</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="title">
      <p class="eyebrow" id="today"></p>
      <div class="hrow"><h1>Website relaunch</h1><button class="chip bsw" id="bsw" aria-label="Switch board" aria-haspopup="menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg></button></div>
    </div>
    <div class="tools">
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
        <input id="q" type="search" placeholder="Search cards" aria-label="Search cards">
        <kbd>/</kbd>
      </label>
      <button class="chip kcmd" id="kcmd" aria-label="Open command palette">⌘K</button>
      <button class="round" id="io" aria-label="Export or import" aria-haspopup="menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M8 8l4-4 4 4M5 15v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3"/></svg></button>
      <button class="round" id="theme" aria-label="Toggle light or dark theme">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <section class="stats" aria-label="Summary">
    <div class="tile dark">
      <div class="ring" role="img" id="ringLabel">
        <svg viewBox="0 0 80 80" aria-hidden="true"><circle class="trk" cx="40" cy="40" r="33"/><circle class="val" id="ring" cx="40" cy="40" r="33"/></svg>
        <b id="ringText">0/0</b>
      </div>
      <div class="dcol"><span class="cap">Done</span><span class="cap sbt" id="sSub">Subtasks 0/0</span></div>
    </div>
    <div class="tile">
      <span class="cap">Overdue</span>
      <b class="big" id="sOver">0</b>
      <span class="sub" id="sOverSub">Nothing late</span>
    </div>
    <div class="tile">
      <span class="cap">Due this week</span>
      <b class="big" id="sWeek">0</b>
      <span class="sub">Next 7 days</span>
    </div>
    <div class="tile">
      <span class="cap">By column</span>
      <div class="bars" id="bars" aria-hidden="true"></div>
    </div>
  </section>

  <div class="chips toolbar-bar" id="chips" role="group" aria-label="Filters, sort and view"><div class="chips-left"></div><div class="chips-right"></div></div>

  <main class="board" id="board"></main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="dr" id="dr" aria-label="Card details"></aside>

<div class="cmd-modal" id="cmd" role="dialog" aria-label="Command palette"><div class="cmd-box"><input type="text" placeholder="Type a command or card title…" aria-label="Command"><div class="cl" role="listbox"></div></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="dist/app.js"></script>
</body>
</html>
